<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VideoDoc Admin</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <div class="page">
      <aside class="sidebar">
        <div class="brand">VideoDoc Admin</div>
        <nav class="side-nav">
          <a href="/web/videos" class="{% if active == 'videos' %}active{% endif %}">视频管理</a>
          <a href="/web/docs" class="{% if active == 'docs' %}active{% endif %}">文档管理</a>
        </nav>
      </aside>
      <main class="content">
        <div class="container">
          {% block content %}{% endblock %}
        </div>
      </main>
    </div>
  </body>
</html>
