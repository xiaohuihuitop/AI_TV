<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="{{ request.state.csrf_token }}" />
    <title>VideoDoc Admin</title>
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body>
    <div class="page">
      <aside class="sidebar">
        <div class="brand">VideoDoc Admin</div>
        <nav class="side-nav">
          <a href="/web/videos" class="{% if active == 'videos' %}active{% endif %}">视频管理</a>
          <a href="/web/docs" class="{% if active == 'docs' %}active{% endif %}">文档管理</a>
          <a href="/web/system" class="{% if active == 'system' %}active{% endif %}">系统状态</a>
        </nav>
      </aside>
      <main class="content">
        <div class="container">
          {% block content %}{% endblock %}
        </div>
      </main>
    </div>
    <script>
      window.aiTvCsrfToken = document.querySelector('meta[name="csrf-token"]').content;
      document.addEventListener("submit", function (event) {
        var form = event.target;
        if (!form || String(form.method || "").toLowerCase() !== "post") return;
        if (form.querySelector('input[name="_csrf_token"]')) return;
        var input = document.createElement("input");
        input.type = "hidden";
        input.name = "_csrf_token";
        input.value = window.aiTvCsrfToken;
        form.appendChild(input);
      }, true);
    </script>
  </body>
</html>
