{% extends "layout.html" %}
{% block content %}
<section class="section">
  <div class="section-title">
    <h1>文档管理</h1>
  </div>
  <form class="card filter-card doc-filter-card" method="get" action="/web/docs">
    <label class="filter-field">
      <span>搜索</span>
      <input class="text-input compact" type="search" name="q" value="{{ filters.q }}" placeholder="文件名或标题" />
    </label>
    <label class="filter-field">
      <span>排序</span>
      <select class="text-input compact" name="sort">
        <option value="" {% if not filters.sort %}selected{% endif %}>最新上传</option>
        <option value="filename" {% if filters.sort == 'filename' %}selected{% endif %}>文件名</option>
        <option value="status" {% if filters.sort == 'status' %}selected{% endif %}>状态</option>
      </select>
    </label>
    <div class="actions filter-actions">
      <button class="btn" type="submit">筛选</button>
      <a class="btn ghost" href="/web/docs">清空</a>
    </div>
  </form>
  <form id="doc-bulk-form" method="post" action="/web/docs/bulk-delete"></form>
  <form class="card upload-card" id="doc-upload-form">
    <div class="card-title">上传文档（HTML/Markdown）</div>
    <div id="doc-drop" class="drop-zone">拖拽 HTML/Markdown 到这里，或点击选择</div>
    <input id="doc-files" class="file" type="file" name="files" accept=".html,.htm,.md,.markdown,text/html,text/markdown" multiple />
    <div id="doc-list" class="upload-list">
      <div class="upload-empty">尚未选择文件</div>
    </div>
    <div id="doc-progress" class="upload-progress" hidden>
      <div class="upload-progress-track">
        <div class="upload-progress-bar"></div>
      </div>
      <div class="upload-progress-text">0%</div>
    </div>
    <div class="actions">
      <button id="doc-upload-btn" class="btn" type="button">上传文档</button>
    </div>
  </form>
  <div class="bulk-bar">
    <button class="btn danger" type="submit" form="doc-bulk-form" onclick="return confirm('确定删除选中的文档吗？')">批量删除</button>
  </div>
  <div class="grid">
    {% for d in items %}
      <article class="card">
        <label class="select-check">
          <input type="checkbox" name="ids" value="{{ d.id }}" form="doc-bulk-form" />
          <span>选择</span>
        </label>
        <div class="card-title">{{ d.title if d.title else d.filename }}</div>
        <div class="meta">
          <span class="pill">{{ d.status }}</span>
        </div>
        <div class="actions">
          <a class="link" href="/web/docs/{{ d.id }}">查看详情</a>
          <form class="inline-form" method="post" action="/web/docs/{{ d.id }}/delete" onsubmit="return confirm('确定删除该文档吗？')">
            <button class="btn danger" type="submit">删除</button>
          </form>
        </div>
      </article>
    {% else %}
      <div class="empty">暂无文档</div>
    {% endfor %}
  </div>
</section>
<script>
  const bindUpload = (options) => {
    const {
      zoneId,
      inputId,
      listId,
      buttonId,
      progressId,
      uploadUrl,
      redirectUrl,
      ext
    } = options;
    const zone = document.getElementById(zoneId);
    const input = document.getElementById(inputId);
    const list = document.getElementById(listId);
    const button = document.getElementById(buttonId);
    const progress = progressId ? document.getElementById(progressId) : null;
    const progressBar = progress ? progress.querySelector(".upload-progress-bar") : null;
    const progressText = progress ? progress.querySelector(".upload-progress-text") : null;
    if (!zone || !input || !list || !button) {
      return;
    }
    const selected = [];
    const allowedExt = Array.isArray(ext) ? ext : [ext];
    const isAllowed = (file) => allowedExt.some((item) => file.name.toLowerCase().endsWith(item));
    const extLabel = allowedExt.join(" / ");
    const fileKey = (file) => `${file.name}-${file.size}-${file.lastModified}`;
    const originalButtonText = button.textContent;
    const setProgress = (percent) => {
      if (!progress || !progressBar || !progressText) {
        return;
      }
      const value = Math.max(0, Math.min(100, Math.round(percent)));
      progress.hidden = false;
      progressBar.style.width = `${value}%`;
      progressText.textContent = `${value}%`;
    };
    const resetProgress = () => {
      if (!progress || !progressBar || !progressText) {
        return;
      }
      progress.hidden = true;
      progressBar.style.width = "0%";
      progressText.textContent = "0%";
    };
    const renderList = () => {
      if (selected.length === 0) {
        list.innerHTML = '<div class="upload-empty">尚未选择文件</div>';
        resetProgress();
        return;
      }
      list.innerHTML = "";
      selected.forEach((file) => {
        const row = document.createElement("div");
        row.className = "upload-item";
        row.innerHTML = `
          <span class="upload-name">${file.name}</span>
          <button class="btn ghost upload-remove" type="button">移除</button>
        `;
        row.querySelector(".upload-remove").addEventListener("click", () => {
          const index = selected.findIndex((item) => fileKey(item) === fileKey(file));
          if (index >= 0) {
            selected.splice(index, 1);
            renderList();
          }
        });
        list.appendChild(row);
      });
    };
    const addFiles = (files) => {
      const invalid = files.filter((file) => !isAllowed(file));
      if (invalid.length) {
        alert(`仅允许 ${extLabel} 文件`);
      }
      files.filter(isAllowed).forEach((file) => {
        const key = fileKey(file);
        if (!selected.some((item) => fileKey(item) === key)) {
          selected.push(file);
        }
      });
      renderList();
    };
    const uploadSelected = async () => {
      if (selected.length === 0) {
        alert("请先选择文件");
        return;
      }
      button.disabled = true;
      button.textContent = "上传中...";
      setProgress(0);
      const form = new FormData();
      selected.forEach((file) => form.append("files", file));
      const xhr = new XMLHttpRequest();
      xhr.open("POST", uploadUrl);
      xhr.withCredentials = true;
      xhr.upload.addEventListener("progress", (event) => {
        if (event.lengthComputable) {
          setProgress((event.loaded / event.total) * 100);
        }
      });
      xhr.addEventListener("load", () => {
        if (xhr.status >= 200 && xhr.status < 400) {
          setProgress(100);
          window.location = redirectUrl;
          return;
        }
        alert(xhr.responseText || "上传失败");
        button.disabled = false;
        button.textContent = originalButtonText;
      });
      xhr.addEventListener("error", () => {
        alert("上传失败，请检查网络");
        button.disabled = false;
        button.textContent = originalButtonText;
      });
      xhr.send(form);
    };
    zone.addEventListener("click", () => input.click());
    zone.addEventListener("dragover", (e) => {
      e.preventDefault();
      zone.classList.add("dragover");
    });
    zone.addEventListener("dragleave", () => zone.classList.remove("dragover"));
    zone.addEventListener("drop", (e) => {
      e.preventDefault();
      zone.classList.remove("dragover");
      addFiles(Array.from(e.dataTransfer.files || []));
    });
    input.addEventListener("change", () => {
      addFiles(Array.from(input.files || []));
      input.value = "";
    });
    button.addEventListener("click", uploadSelected);
    renderList();
  };

  bindUpload({
    zoneId: "doc-drop",
    inputId: "doc-files",
    listId: "doc-list",
    buttonId: "doc-upload-btn",
    progressId: "doc-progress",
    uploadUrl: "/web/upload/doc",
    redirectUrl: "/web/docs",
    ext: [".html", ".htm", ".md", ".markdown"]
  });
</script>
{% endblock %}
