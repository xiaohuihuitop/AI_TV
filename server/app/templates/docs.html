{% extends "layout.html" %}
{% block content %}
<section class="section">
  <div class="section-title">
    <h1>文档管理</h1>
  </div>
  <form class="card upload-card" id="doc-upload-form">
    <div class="card-title">上传文档（HTML）</div>
    <div id="doc-drop" class="drop-zone">拖拽 HTML 到这里，或点击选择</div>
    <input id="doc-files" class="file" type="file" name="files" accept="text/html" multiple />
    <div id="doc-list" class="upload-list">
      <div class="upload-empty">尚未选择文件</div>
    </div>
    <div class="actions">
      <button id="doc-upload-btn" class="btn" type="button">上传文档</button>
    </div>
  </form>
  <div class="grid">
    {% for d in items %}
      <article class="card">
        <div class="card-title">{{ d.title if d.title else d.filename }}</div>
        <div class="meta">
          <span class="pill">{{ d.status }}</span>
        </div>
        <div class="actions">
          <a class="link" href="/web/docs/{{ d.id }}">查看详情</a>
          <form class="inline-form" method="post" action="/web/docs/{{ d.id }}/delete" onsubmit="return confirm('确定删除该文档吗？')">
            <button class="btn danger" type="submit">删除</button>
          </form>
        </div>
      </article>
    {% else %}
      <div class="empty">暂无文档</div>
    {% endfor %}
  </div>
</section>
<script>
  const bindUpload = (options) => {
    const {
      zoneId,
      inputId,
      listId,
      buttonId,
      uploadUrl,
      redirectUrl,
      ext
    } = options;
    const zone = document.getElementById(zoneId);
    const input = document.getElementById(inputId);
    const list = document.getElementById(listId);
    const button = document.getElementById(buttonId);
    if (!zone || !input || !list || !button) {
      return;
    }
    const selected = [];
    const isAllowed = (file) => file.name.toLowerCase().endsWith(ext);
    const fileKey = (file) => `${file.name}-${file.size}-${file.lastModified}`;
    const renderList = () => {
      if (selected.length === 0) {
        list.innerHTML = '<div class="upload-empty">尚未选择文件</div>';
        return;
      }
      list.innerHTML = "";
      selected.forEach((file) => {
        const row = document.createElement("div");
        row.className = "upload-item";
        row.innerHTML = `
          <span class="upload-name">${file.name}</span>
          <button class="btn ghost upload-remove" type="button">移除</button>
        `;
        row.querySelector(".upload-remove").addEventListener("click", () => {
          const index = selected.findIndex((item) => fileKey(item) === fileKey(file));
          if (index >= 0) {
            selected.splice(index, 1);
            renderList();
          }
        });
        list.appendChild(row);
      });
    };
    const addFiles = (files) => {
      const invalid = files.filter((file) => !isAllowed(file));
      if (invalid.length) {
        alert(`仅允许 ${ext} 文件`);
      }
      files.filter(isAllowed).forEach((file) => {
        const key = fileKey(file);
        if (!selected.some((item) => fileKey(item) === key)) {
          selected.push(file);
        }
      });
      renderList();
    };
    const uploadSelected = async () => {
      if (selected.length === 0) {
        alert("请先选择文件");
        return;
      }
      button.disabled = true;
      const form = new FormData();
      selected.forEach((file) => form.append("files", file));
      const resp = await fetch(uploadUrl, {
        method: "POST",
        body: form,
        credentials: "same-origin",
      });
      if (resp.status >= 200 && resp.status < 400) {
        window.location = redirectUrl;
        return;
      }
      const text = await resp.text();
      alert(text || "上传失败");
      button.disabled = false;
    };
    zone.addEventListener("click", () => input.click());
    zone.addEventListener("dragover", (e) => {
      e.preventDefault();
      zone.classList.add("dragover");
    });
    zone.addEventListener("dragleave", () => zone.classList.remove("dragover"));
    zone.addEventListener("drop", (e) => {
      e.preventDefault();
      zone.classList.remove("dragover");
      addFiles(Array.from(e.dataTransfer.files || []));
    });
    input.addEventListener("change", () => {
      addFiles(Array.from(input.files || []));
      input.value = "";
    });
    button.addEventListener("click", uploadSelected);
    renderList();
  };

  bindUpload({
    zoneId: "doc-drop",
    inputId: "doc-files",
    listId: "doc-list",
    buttonId: "doc-upload-btn",
    uploadUrl: "/web/upload/doc",
    redirectUrl: "/web/docs",
    ext: ".html"
  });
</script>
{% endblock %}
