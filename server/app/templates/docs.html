{% extends "layout.html" %}
{% block content %}
<section class="section">
  <div class="section-title">
    <h1>文档列表</h1>
    <a class="btn" href="/web/upload">上传</a>
  </div>
  <div class="grid">
    {% for d in items %}
      <article class="card">
        <div class="card-title">{{ d.title if d.title else d.filename }}</div>
        <div class="meta">
          <span class="pill">{{ d.status }}</span>
        </div>
        <div class="actions">
          <a class="link" href="/web/docs/{{ d.id }}">查看详情</a>
        </div>
      </article>
    {% else %}
      <div class="empty">暂无文档</div>
    {% endfor %}
  </div>
</section>
{% endblock %}
