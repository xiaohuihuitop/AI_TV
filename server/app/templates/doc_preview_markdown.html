<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ title }}</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #2d2a26;
        --muted: #6b645b;
        --paper: #f7f3ef;
        --line: rgba(45, 42, 38, 0.08);
        --accent: #b45309;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Source Serif 4", "Noto Serif SC", "Noto Serif", "Times New Roman", serif;
        font-size: 17px;
        line-height: 1.8;
      }

      .page {
        max-width: 820px;
        margin: 0 auto;
        padding: 48px 32px 64px;
      }

      .title {
        font-family: "Source Sans 3", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
        font-size: 30px;
        letter-spacing: 0.02em;
        margin: 0 0 20px;
      }

      .subtitle {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        font-family: "Source Sans 3", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
      }

      .content {
        background: #fff;
        padding: 32px 36px;
        border-radius: 18px;
        box-shadow: 0 18px 48px rgba(45, 42, 38, 0.08);
        border: 1px solid var(--line);
      }

      .content > :first-child {
        margin-top: 0;
      }

      h1,
      h2,
      h3,
      h4 {
        font-family: "Source Sans 3", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
        margin: 28px 0 12px;
        line-height: 1.3;
      }

      h1 {
        font-size: 28px;
      }

      h2 {
        font-size: 22px;
      }

      h3 {
        font-size: 18px;
      }

      p {
        margin: 12px 0;
      }

      a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid rgba(180, 83, 9, 0.3);
      }

      a:hover {
        border-bottom-color: rgba(180, 83, 9, 0.7);
      }

      blockquote {
        margin: 20px 0;
        padding: 12px 18px;
        border-left: 4px solid rgba(180, 83, 9, 0.4);
        background: rgba(180, 83, 9, 0.06);
        color: var(--muted);
        border-radius: 12px;
      }

      code {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        background: rgba(45, 42, 38, 0.08);
        padding: 2px 6px;
        border-radius: 6px;
        font-size: 0.9em;
      }

      pre {
        background: #f1eae2;
        padding: 16px;
        border-radius: 14px;
        overflow: auto;
        font-size: 0.9em;
      }

      pre code {
        background: none;
        padding: 0;
      }

      hr {
        border: none;
        height: 1px;
        background: var(--line);
        margin: 28px 0;
      }

      ul,
      ol {
        padding-left: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        font-size: 0.95em;
      }

      th,
      td {
        border: 1px solid var(--line);
        padding: 8px 12px;
        text-align: left;
      }

      img {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 18px 0;
        border-radius: 12px;
      }

      @media (max-width: 768px) {
        .page {
          padding: 32px 18px 48px;
        }

        .content {
          padding: 24px 20px;
        }

        .title {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="subtitle">Markdown Preview</div>
      <h1 class="title">{{ title }}</h1>
      <article class="content">
        {{ content | safe }}
      </article>
    </main>
  </body>
</html>
