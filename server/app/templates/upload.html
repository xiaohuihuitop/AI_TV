{% extends "layout.html" %}
{% block content %}
<section class="section">
  <div class="section-title">
    <h1>上传资源</h1>
    <a class="btn ghost" href="/web/videos">返回列表</a>
  </div>
  <div class="upload-grid">
    <form class="card" id="video-upload-form">
      <div class="card-title">上传视频（MP4）</div>
      <div id="video-drop" class="drop-zone">拖拽 MP4 到这里，或点击选择</div>
      <input id="video-files" class="file" type="file" name="files" accept="video/mp4" multiple />
      <div id="video-list" class="upload-list">
        <div class="upload-empty">尚未选择文件</div>
      </div>
      <div id="video-progress" class="upload-progress" hidden>
        <div class="upload-progress-track">
          <div class="upload-progress-bar"></div>
        </div>
        <div class="upload-progress-text">0%</div>
      </div>
      <button id="video-upload-btn" class="btn" type="button">上传视频</button>
    </form>
    <form class="card" id="doc-upload-form">
      <div class="card-title">上传文档（HTML/Markdown）</div>
      <div id="doc-drop" class="drop-zone">拖拽 HTML/Markdown 到这里，或点击选择</div>
      <input id="doc-files" class="file" type="file" name="files" accept=".html,.htm,.md,.markdown,text/html,text/markdown" multiple />
      <div id="doc-list" class="upload-list">
        <div class="upload-empty">尚未选择文件</div>
      </div>
      <div id="doc-progress" class="upload-progress" hidden>
        <div class="upload-progress-track">
          <div class="upload-progress-bar"></div>
        </div>
        <div class="upload-progress-text">0%</div>
      </div>
      <button id="doc-upload-btn" class="btn" type="button">上传文档</button>
    </form>
  </div>
</section>
<script src="/static/upload.js"></script>
<script>
  bindUpload({
    zoneId: "video-drop",
    inputId: "video-files",
    listId: "video-list",
    buttonId: "video-upload-btn",
    progressId: "video-progress",
    uploadUrl: "/web/upload/video",
    redirectUrl: "/web/videos?watch=processing",
    ext: ".mp4"
  });
  bindUpload({
    zoneId: "doc-drop",
    inputId: "doc-files",
    listId: "doc-list",
    buttonId: "doc-upload-btn",
    progressId: "doc-progress",
    uploadUrl: "/web/upload/doc",
    redirectUrl: "/web/docs",
    ext: [".html", ".htm", ".md", ".markdown"]
  });
</script>
{% endblock %}
