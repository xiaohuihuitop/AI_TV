{% extends "layout.html" %}
{% block content %}
<section class="section">
  <div class="section-title">
    <h1>视频详情</h1>
    <div class="section-actions">
      <a class="btn ghost" href="/web/videos">返回列表</a>
      <form class="inline-form" method="post" action="/web/videos/{{ video.id }}/delete" onsubmit="return confirm('确定删除该视频吗？')">
        <button class="btn danger" type="submit">删除</button>
      </form>
    </div>
  </div>
  <div class="detail">
    <div class="detail-meta">
      <div><strong>文件名：</strong>{{ video.filename }}</div>
      <div><strong>状态：</strong>{{ video.status }}</div>
      <div><strong>时长：</strong>{{ '%.2f'|format(video.duration_seconds) if video.duration_seconds else '未知' }}</div>
    </div>
    {% if video.cover_path %}
      <img class="detail-cover" src="/web/videos/{{ video.id }}/cover" alt="cover" style="max-height:240px;object-fit:cover;" />
    {% endif %}
    <video class="player" controls src="/api/videos/{{ video.id }}/download"></video>
  </div>
</section>
{% endblock %}
